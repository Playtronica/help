name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preflight:
    name: Lint, types, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Cross-reference audit
        run: npm run audit

      - name: User-journey simulator
        run: |
          node scripts/build-search-index.mjs
          npm run review:2

      - name: Ecommerce friction audit
        run: npm run review:3

      - name: Trust-signal audit
        run: npm run review:4

      - name: Build (static export)
        env:
          NEXT_OUTPUT_MODE: export
        run: npm run build

      - name: Check output
        run: |
          test -f out/index.html
          test -f out/llms.txt
          test -f out/llms-full.txt
          test -f out/sitemap.xml
          test -f out/robots.txt
          PAGE_COUNT=$(find out -name "*.html" | wc -l)
          echo "Built $PAGE_COUNT HTML pages"
          if [ "$PAGE_COUNT" -lt 40 ]; then
            echo "Expected at least 40 HTML pages — got $PAGE_COUNT"
            exit 1
          fi
