name: Translate

# Translates pages whose English source changed (or that were never translated)
# into German, Spanish, French, and Japanese, then opens a pull request with
# the results for review.
#
# Setup: add a repository secret named ANTHROPIC_API_KEY
# (Settings → Secrets and variables → Actions → New repository secret).
#
# Run the first bulk translation manually:
#   Actions tab → Translate → Run workflow.

on:
  # Manual trigger — use this for the initial full translation run.
  workflow_dispatch:
    inputs:
      language:
        description: "Limit to one language (de/es/fr/ja), or leave blank for all"
        required: false
        default: ""
  # Automatic — whenever English content changes on main.
  push:
    branches: [main]
    paths:
      - "content/en/**"

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Translate changed pages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.language }}" ]; then
            node scripts/translate-pages.mjs --lang "${{ github.event.inputs.language }}"
          else
            node scripts/translate-pages.mjs
          fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: translations/update
          title: "Translations — sync with English"
          commit-message: "Translate pages changed in English"
          body: |
            Machine translations generated by `scripts/translate-pages.mjs`.

            Each translated file records the `source_sha` of the English page
            it was translated from. Review the diff and merge.

            Run `npm run i18n:status` locally to see remaining gaps.
          labels: translations
          delete-branch: true
